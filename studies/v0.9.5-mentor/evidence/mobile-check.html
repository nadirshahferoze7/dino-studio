<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dino responsive playback QA</title><style>body{background:#dce3d6;color:#183e33;font:15px system-ui;margin:20px}iframe{display:block;width:390px;height:844px;border:1px solid #8b9f86;background:white;margin:16px 0}button{padding:10px;margin:4px}</style><h1>Responsive playback check</h1><p>Real hosted review page inside a narrow CSS viewport. This checks layout and playback, not physical Android/iOS compatibility.</p><button data-width="360">360px</button><button data-width="390">390px</button><button data-width="430">430px</button><p id="width">390px</p><iframe title="Mobile audition viewport" src="../"></iframe><script>for(const b of document.querySelectorAll('button'))b.onclick=()=>{document.querySelector('iframe').style.width=b.dataset.width+'px';document.getElementById('width').textContent=b.dataset.width+'px'}</script></html>
